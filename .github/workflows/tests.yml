name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.paths.outputs.core }}
      web: ${{ steps.paths.outputs.web }}
      chips_db: ${{ steps.paths.outputs.chips_db }}
      ws_poker: ${{ steps.paths.outputs.ws_poker }}
      games: ${{ steps.paths.outputs.games }}
      infra: ${{ steps.paths.outputs.infra }}
      deploy_ws: ${{ steps.paths.outputs.deploy_ws }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Classify changed paths
        id: paths
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-impact.mjs --github-output "$GITHUB_OUTPUT"

  chips-retention-integration:
    needs: impact
    if: ${{ needs.impact.outputs.chips_db == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: contractpass
          POSTGRES_DB: chips_retention_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chips_retention_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHIPS_MIGRATIONS_TEST_DB_URL: postgresql://postgres:contractpass@127.0.0.1:5433/chips_retention_test
      POKER_POLICY_TEST_DB_URL: postgresql://postgres:contractpass@127.0.0.1:5433/poker_pool_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm i

      - name: Bootstrap minimal Supabase auth and storage schemas
        run: |
          psql "$CHIPS_MIGRATIONS_TEST_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role noinherit;
            end if;
          end
          $$;
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key
          );
          insert into auth.users (id) values
            ('00000000-0000-4000-8000-000000000001'),
            ('00000000-0000-4000-8000-000000000002'),
            ('00000000-0000-4000-8000-000000000003'),
            ('00000000-0000-4000-8000-000000000004')
          on conflict (id) do nothing;
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select null::uuid;
          $$;
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table if not exists storage.objects (
            id bigint generated always as identity primary key
          );
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          SQL

      - name: Poker refill scheduler removal guard
        run: node tests/chips/chips-ledger-stage-automation.workflow.guard.test.mjs

      - name: Reset CLI PostgreSQL contracts
        run: node --test tests/chips-economy-reset-cli.contract.test.mjs
        env:
          CHIPS_RESET_CLI_TEST_DB_URL: ${{ env.CHIPS_MIGRATIONS_TEST_DB_URL }}

      - name: Apply migrations and run migration contracts
        run: node tests/chips/chips.migration.test.mjs

      - name: Run PostgreSQL legacy Stage allowlist audit contracts
        run: node tests/chips/chips-ledger-legacy-stage-allowlist-audit.test.mjs

      - name: Run PostgreSQL bot-only retention contracts
        run: node tests/chips/chips-ledger-bot-only-retention.test.mjs

      - name: Run PostgreSQL Stage cleanup orchestration contracts
        run: node tests/chips/chips-ledger-stage-cleanup-orchestration.test.mjs

      - name: Run PostgreSQL TABLE metadata fence regressions
        run: node tests/chips/chips-ledger-table-metadata-fence.test.mjs

      - name: Create isolated PostgreSQL poker pool test database
        run: psql "$CHIPS_MIGRATIONS_TEST_DB_URL" -v ON_ERROR_STOP=1 -c "create database poker_pool_test;"

      - name: Run disposable PostgreSQL poker pool refill contracts
        run: node --test tests/chips/poker-pool-policy.transaction.test.mjs

  core:
    needs: impact
    if: ${{ needs.impact.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm i
      - name: Install WS runtime dependencies for core contracts
        run: npm ci --prefix ws-server --omit=dev
      - name: Run core tests once
        run: npm test

  ws-persistence-integration:
    needs: impact
    if: ${{ needs.impact.outputs.ws_poker == 'true' || needs.impact.outputs.chips_db == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: contractpass
          POSTGRES_DB: reset_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reset_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHIPS_RESET_CLI_TEST_DB_URL: postgresql://postgres:contractpass@127.0.0.1:5432/reset_contract
      TEST_DB_URL: postgresql://postgres:contractpass@127.0.0.1:5432/reset_contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm i
      - name: Install WS server runtime dependencies
        run: npm ci --prefix ws-server --omit=dev
      - name: Native JSONB integration test
        run: node --test ws-server/poker/persistence/native-jsonb.integration.test.mjs
      - name: Action-history cleanup PostgreSQL integration test
        run: node --test ws-server/poker/persistence/action-history-cleanup.integration.test.mjs
      - name: Closed-table cleanup PostgreSQL integration test
        run: node --test ws-server/poker/persistence/closed-table-cleanup.integration.test.mjs

  playwright:
    needs: impact
    if: ${{ needs.impact.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm i
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BROWSER: chromium
