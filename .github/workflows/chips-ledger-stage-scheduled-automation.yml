name: Chips Ledger Stage Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage automation mode
        required: true
        default: existing-30d
        type: choice
        options:
          - existing-30d
          - existing-30d-recovery-diagnostic
          - existing-30d-recovery-repair
          - bot-only-7d-summary-diagnostic
          - bot-only-7d-automatic
          - escrow-retention-audit
          - escrow-retention-verify
          - external-scheduled-automatic
      stage_30d_recovery_batch_id:
        description: Exact Stage 30-day recovery batch_id (optional for existing-30d-recovery-diagnostic; required for existing-30d-recovery-repair)
        required: false
        type: string
      escrow_retention_recovery_object_path:
        description: Exact private account recovery object path (only for verify)
        required: false
        type: string
      escrow_retention_recovery_confirmation:
        description: Exact VERIFY <recovery_object_path> confirmation (only for verify)
        required: false
        type: string
  schedule:
    # Second cron runs Stage escrow retention every 15 minutes.
    - cron: "17 2 * * *"
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: chips-ledger-stage-automation
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  stage-archive:
    if: ${{ vars.CHIPS_LEDGER_STAGE_AUTOMATION_ENABLED == '1' && (github.event_name != 'workflow_dispatch' || (inputs.mode != 'escrow-retention-audit' && inputs.mode != 'escrow-retention-verify' && inputs.mode != 'existing-30d-recovery-repair') || (github.ref == 'refs/heads/main' && github.repository == 'krzysztofcal/arcadePlatform' && github.event.repository.fork != true && (inputs.mode == 'escrow-retention-audit' || inputs.mode == 'escrow-retention-verify' || github.actor == github.repository_owner))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_STAGE_DB_URL: ${{ secrets.SUPABASE_STAGE_DB_URL }}
      SUPABASE_STAGE_URL: ${{ secrets.SUPABASE_STAGE_URL }}
      SUPABASE_STAGE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve checked-out commit
        id: checkout-sha
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Read-only Stage fence preflight
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'existing-30d-recovery-diagnostic' || inputs.mode == 'existing-30d-recovery-repair' || inputs.mode == 'bot-only-7d-summary-diagnostic' || inputs.mode == 'bot-only-7d-automatic' || inputs.mode == 'escrow-retention-audit' || inputs.mode == 'escrow-retention-verify') }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const EXPECTED_SYSTEM_IDENTIFIER = "7656985631720456337";
          const isTrue = (value) => value === true || value === "t";
          const sql = postgres(process.env.SUPABASE_STAGE_DB_URL, {
            max: 1,
            prepare: false,
            connect_timeout: 10,
            idle_timeout: 0,
          });

          try {
            await sql.begin(async (tx) => {
              await tx.unsafe("set transaction read only");

              const identityRows = await tx.unsafe(
                "select system_identifier::text as system_identifier from pg_catalog.pg_control_system();",
              );
              if (identityRows[0]?.system_identifier !== EXPECTED_SYSTEM_IDENTIFIER) {
                throw new Error("Stage system identifier preflight mismatch");
              }

              const activeRows = await tx.unsafe(
                "select public.chips_table_fence_is_active() as active;",
              );
              if (!isTrue(activeRows[0]?.active)) {
                throw new Error("Stage TABLE fence is not active");
              }

              const controlRows = await tx.unsafe(
                "select enforcement_active from public.chips_table_fence_control where control_id is true;",
              );
              if (controlRows.length !== 1 || !isTrue(controlRows[0]?.enforcement_active)) {
                throw new Error("Stage TABLE fence control is not active");
              }
            });
          } finally {
            await sql.end({ timeout: 5 });
          }

          process.stdout.write("Stage read-only fence preflight passed\n");
          NODE

      - name: Run existing 30-day Stage automation
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'existing-30d') }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
        run: node scripts/ops/chips-ledger-stage-automation.mjs

      - name: Diagnose existing 30-day durable recovery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'existing-30d-recovery-diagnostic' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
          STAGE_30D_RECOVERY_BATCH_ID: ${{ inputs.stage_30d_recovery_batch_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOYED_COMMIT_SHA" = "$GITHUB_SHA"
          test -z "${CHIPS_LEDGER_BOT_ONLY_EXECUTE:-}"
          test -z "${CHIPS_LEDGER_BOT_ONLY_AUTOMATIC:-}"
          if [[ -n "$STAGE_30D_RECOVERY_BATCH_ID" ]]; then
            if [[ ! "$STAGE_30D_RECOVERY_BATCH_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "stage_30d_recovery_batch_id must be a positive integer" >&2
              exit 1
            fi
            node scripts/ops/chips-ledger-stage-automation.mjs \
              --policy stage-ledger-auto-retention-30d-v1 \
              --diagnose-recovery \
              --batch-id "$STAGE_30D_RECOVERY_BATCH_ID"
          else
            node scripts/ops/chips-ledger-stage-automation.mjs \
              --policy stage-ledger-auto-retention-30d-v1 \
              --diagnose-recovery
          fi

      - name: Repair exact existing 30-day durable recovery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'existing-30d-recovery-repair' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
          STAGE_30D_RECOVERY_BATCH_ID: ${{ inputs.stage_30d_recovery_batch_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOYED_COMMIT_SHA" = "$GITHUB_SHA"
          test -z "${CHIPS_LEDGER_BOT_ONLY_EXECUTE:-}"
          test -z "${CHIPS_LEDGER_BOT_ONLY_AUTOMATIC:-}"
          if [[ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo "existing 30-day recovery repair requires the repository owner" >&2
            exit 1
          fi
          if [[ ! "$STAGE_30D_RECOVERY_BATCH_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "stage_30d_recovery_batch_id must be a positive integer" >&2
            exit 1
          fi
          node scripts/ops/chips-ledger-stage-automation.mjs \
            --policy stage-ledger-auto-retention-30d-v1 \
            --repair-recovery \
            --batch-id "$STAGE_30D_RECOVERY_BATCH_ID"

      - name: Run bot-only 7-day summary diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bot-only-7d-summary-diagnostic' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOYED_COMMIT_SHA" = "$GITHUB_SHA"
          test -z "${CHIPS_LEDGER_BOT_ONLY_EXECUTE:-}"
          test -z "${CHIPS_LEDGER_BOT_ONLY_AUTOMATIC:-}"
          node scripts/ops/chips-ledger-stage-timeout-diagnostic.mjs --summary-only

      - name: Run activated bot-only 7-day Stage automation
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'bot-only-7d-automatic') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'external-scheduled-automatic') }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
          CHIPS_LEDGER_BOT_ONLY_AUTOMATIC: "1"
        run: node scripts/ops/chips-ledger-stage-automation.mjs --policy bot-only-7d --automatic

      - name: Run Stage escrow account retention
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'external-scheduled-automatic') }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
        run: node scripts/ops/chips-ledger-stage-escrow-retention.mjs --automatic

      - name: Audit Stage escrow account retention
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'escrow-retention-audit' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
          ESCROW_RETENTION_RECOVERY_OBJECT_PATH: ${{ inputs.escrow_retention_recovery_object_path }}
          ESCROW_RETENTION_RECOVERY_CONFIRMATION: ${{ inputs.escrow_retention_recovery_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOYED_COMMIT_SHA" = "$GITHUB_SHA"
          test -z "$ESCROW_RETENTION_RECOVERY_OBJECT_PATH"
          test -z "$ESCROW_RETENTION_RECOVERY_CONFIRMATION"
          node scripts/ops/chips-ledger-stage-escrow-retention.mjs --audit

      - name: Verify Stage escrow account-retention recovery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'escrow-retention-verify' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
          ESCROW_RETENTION_RECOVERY_OBJECT_PATH: ${{ inputs.escrow_retention_recovery_object_path }}
          ESCROW_RETENTION_RECOVERY_CONFIRMATION: ${{ inputs.escrow_retention_recovery_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOYED_COMMIT_SHA" = "$GITHUB_SHA"
          if [[ ! "$ESCROW_RETENTION_RECOVERY_OBJECT_PATH" =~ ^account-recovery/v1/sha256/[0-9a-f]{64}\.json\.gz$ ]]; then
            echo "escrow_retention_recovery_object_path must be an exact content-addressed path" >&2
            exit 1
          fi
          if [[ "$ESCROW_RETENTION_RECOVERY_CONFIRMATION" != "VERIFY $ESCROW_RETENTION_RECOVERY_OBJECT_PATH" ]]; then
            echo "escrow_retention_recovery_confirmation must be exactly VERIFY <recovery_object_path>" >&2
            exit 1
          fi
          node scripts/ops/chips-ledger-stage-escrow-account-recovery.mjs \
            --object-path "$ESCROW_RETENTION_RECOVERY_OBJECT_PATH"
