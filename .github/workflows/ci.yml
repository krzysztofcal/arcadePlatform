name: CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  actionlint:
    name: actionlint
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate all GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.paths.outputs.core }}
      web: ${{ steps.paths.outputs.web }}
      chips_db: ${{ steps.paths.outputs.chips_db }}
      ws_poker: ${{ steps.paths.outputs.ws_poker }}
      games: ${{ steps.paths.outputs.games }}
      infra: ${{ steps.paths.outputs.infra }}
      deploy_ws: ${{ steps.paths.outputs.deploy_ws }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Classify changed paths
        id: paths
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-impact.mjs --github-output "$GITHUB_OUTPUT"

  verify:
    needs: impact
    if: ${{ needs.impact.outputs.web == 'true' || needs.impact.outputs.games == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Structural guards
        run: npm run ci:guards

  chips-integration:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CHIPS_INTEGRATION_ENABLED == '1' && needs.impact.outputs.chips_db == 'true' }}
    needs: impact
    runs-on: ubuntu-latest
    steps:
      - name: Chips integration preflight (skip if secrets missing)
        id: chips_preflight
        shell: bash
        run: |
          if [ -z "${CHIPS_TEST_BASE_URL}" ] || [ -z "${CHIPS_TEST_USER_JWT}" ]; then
            echo "Required chips secrets missing; skipping chips integration."
            echo "should_run=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=1" >> "$GITHUB_OUTPUT"
        env:
          CHIPS_TEST_BASE_URL: ${{ secrets.CHIPS_TEST_BASE_URL }}
          CHIPS_TEST_USER_JWT: ${{ secrets.CHIPS_TEST_USER_JWT }}
      - uses: actions/checkout@v4
        if: ${{ steps.chips_preflight.outputs.should_run == '1' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.chips_preflight.outputs.should_run == '1' }}
        with: { node-version: 20 }
      - name: Install dependencies
        if: ${{ steps.chips_preflight.outputs.should_run == '1' }}
        run: npm ci || npm i
      - name: Run chips integration tests
        if: ${{ steps.chips_preflight.outputs.should_run == '1' }}
        run: npm run test:chips
        env:
          CHIPS_TEST_BASE_URL: ${{ secrets.CHIPS_TEST_BASE_URL }}
          CHIPS_TEST_USER_JWT: ${{ secrets.CHIPS_TEST_USER_JWT }}
          CHIPS_TEST_TIMEOUT_MS: ${{ secrets.CHIPS_TEST_TIMEOUT_MS }}
