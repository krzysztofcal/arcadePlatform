name: Chips Ledger Stage Explain Analyze (temporary)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact checked-out commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  explain-analyze:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_STAGE_DB_URL: ${{ secrets.SUPABASE_STAGE_DB_URL }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      DEPLOYED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact diagnostic ref
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$GITHUB_SHA"
          test "$checked_out_sha" = "$EXPECTED_SHA"

      - name: Read-only Stage fence preflight
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const EXPECTED_SYSTEM_IDENTIFIER = "7656985631720456337";
          const isTrue = (value) => value === true || value === "t";
          const sql = postgres(process.env.SUPABASE_STAGE_DB_URL, {
            max: 1,
            prepare: false,
            connect_timeout: 10,
            idle_timeout: 0,
          });

          try {
            await sql.begin(async (tx) => {
              await tx.unsafe("set transaction read only");
              const identityRows = await tx.unsafe(
                "select system_identifier::text as system_identifier from pg_catalog.pg_control_system();",
              );
              if (identityRows[0]?.system_identifier !== EXPECTED_SYSTEM_IDENTIFIER) {
                throw new Error("Stage system identifier preflight mismatch");
              }
              const activeRows = await tx.unsafe(
                "select public.chips_table_fence_is_active() as active;",
              );
              if (!isTrue(activeRows[0]?.active)) {
                throw new Error("Stage TABLE fence is not active");
              }
              const controlRows = await tx.unsafe(
                "select enforcement_active from public.chips_table_fence_control where control_id is true;",
              );
              if (controlRows.length !== 1 || !isTrue(controlRows[0]?.enforcement_active)) {
                throw new Error("Stage TABLE fence control is not active");
              }
            });
          } finally {
            await sql.end({ timeout: 5 });
          }
          process.stdout.write("Stage read-only fence preflight passed\n");
          NODE

      - name: Run one bounded read-only EXPLAIN ANALYZE
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import postgres from "postgres";
          import { BOT_ONLY_CANDIDATE_SQL } from "./scripts/ops/chips-ledger-archive-export.mjs";

          const EXPECTED_SQL_SHA256 = "085181c358f977c2f16b6b5a2688b7bf92e4cbe14025a772d3dec70bbc44396d";
          const sqlSha256 = (query) => createHash("sha256").update(query).digest("hex");
          const actualSqlSha256 = sqlSha256(BOT_ONLY_CANDIDATE_SQL);
          if (actualSqlSha256 !== EXPECTED_SQL_SHA256) {
            throw new Error("candidate SQL hash mismatch");
          }

          const summarizeNode = (node, path) => ({
            path,
            node_type: node["Node Type"] || null,
            relation: node["Relation Name"] || null,
            cte: node["CTE Name"] || null,
            actual_startup_ms: node["Actual Startup Time"] ?? null,
            actual_total_ms: node["Actual Total Time"] ?? null,
            actual_rows: node["Actual Rows"] ?? null,
            actual_loops: node["Actual Loops"] ?? null,
            inclusive_ms: (node["Actual Total Time"] ?? 0) * (node["Actual Loops"] ?? 1),
            shared_hit_blocks: node["Shared Hit Blocks"] ?? null,
            shared_read_blocks: node["Shared Read Blocks"] ?? null,
            shared_dirtied_blocks: node["Shared Dirtied Blocks"] ?? null,
            shared_written_blocks: node["Shared Written Blocks"] ?? null,
            temp_read_blocks: node["Temp Read Blocks"] ?? null,
            temp_written_blocks: node["Temp Written Blocks"] ?? null,
            peak_memory_kb: node["Peak Memory Usage"] ?? null,
            sort_space_kb: node["Sort Space Used"] ?? null,
            sort_space_type: node["Sort Space Type"] ?? null,
            hash_batches: node["Hash Batches"] ?? null,
            disk_usage_kb: node["Disk Usage"] ?? null,
          });

          const collectNodes = (node, path = "Plan", output = []) => {
            if (!node || typeof node !== "object") return output;
            if (node["Node Type"]) output.push(summarizeNode(node, path));
            for (const [index, child] of (node.Plans || []).entries()) {
              collectNodes(child, `${path}/Plans[${index}]`, output);
            }
            return output;
          };

          const cutoff = new Date(Date.now() - (7 * 24 * 60 * 60 * 1000)).toISOString();
          const parameters = [cutoff, 5000, null, null];
          const sql = postgres(process.env.SUPABASE_STAGE_DB_URL, {
            max: 1,
            prepare: false,
            connect_timeout: 10,
            idle_timeout: 0,
          });
          const started = process.hrtime.bigint();

          try {
            const result = await sql.begin(async (tx) => {
              await tx.unsafe("set transaction isolation level repeatable read, read only");
              await tx.unsafe("set local statement_timeout = '300000ms'");
              await tx.unsafe("set local lock_timeout = '10000ms'");
              const rows = await tx.unsafe(
                `explain (analyze, buffers, timing off, format json) ${BOT_ONLY_CANDIDATE_SQL}`,
                parameters,
              );
              const payload = rows[0]?.["QUERY PLAN"] || rows[0]?.["query plan"];
              const explain = payload?.[0] || {};
              const nodes = collectNodes(explain.Plan);
              const topNodes = [...nodes]
                .sort((left, right) => right.inclusive_ms - left.inclusive_ms)
                .slice(0, 12);
              const resourceNodes = nodes.filter((node) => (
                (node.temp_read_blocks || 0) > 0
                || (node.temp_written_blocks || 0) > 0
                || node.peak_memory_kb !== null
                || node.sort_space_kb !== null
                || node.disk_usage_kb !== null
              ));
              return {
                sql_sha256: actualSqlSha256,
                cutoff,
                statement_timeout_ms: 300000,
                lock_timeout_ms: 10000,
                read_only: true,
                isolation: "repeatable read",
                explain_options: "ANALYZE, BUFFERS, TIMING OFF, FORMAT JSON",
                elapsed_ms: Number(process.hrtime.bigint() - started) / 1e6,
                sqlstate: "00000",
                planning_time_ms: explain["Planning Time"] ?? null,
                execution_time_ms: explain["Execution Time"] ?? null,
                plan_node_count: nodes.length,
                critical_nodes: topNodes,
                resource_nodes: resourceNodes,
              };
            });
            process.stdout.write(JSON.stringify({
              event: "chips_ledger_stage_explain_analyze",
              target: "stage",
              deployed_commit_sha: process.env.DEPLOYED_COMMIT_SHA,
              ...result,
            }) + "\n");
          } catch (error) {
            process.stdout.write(JSON.stringify({
              event: "chips_ledger_stage_explain_analyze",
              target: "stage",
              deployed_commit_sha: process.env.DEPLOYED_COMMIT_SHA,
              sql_sha256: actualSqlSha256,
              elapsed_ms: Number(process.hrtime.bigint() - started) / 1e6,
              sqlstate: error?.code || "unknown",
              error_class: "explain_analyze_failed",
            }) + "\n");
            process.exitCode = 1;
          } finally {
            await sql.end({ timeout: 5 });
          }
          NODE
