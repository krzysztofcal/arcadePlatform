name: Android Production AAB (unsigned)

on:
  workflow_dispatch:
    inputs:
      sourceSha:
        description: Exact current main commit SHA
        required: true
        type: string
      versionName:
        description: Play Store versionName (e.g. 1.0.0)
        required: true
        type: string
      versionCode:
        description: Play Store versionCode (integer <= 2100000000)
        required: true
        type: string

# Manual dispatch from main only: no pull_request trigger, so PR code never receives MOBILE_LOBBY_MUSIC_KEY here.
permissions:
  contents: read

concurrency:
  group: android-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-aab:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MOBILE_CHANNEL: production
      SOURCE_SHA: ${{ inputs.sourceSha }}
      # Inputs pass through unchanged; empty or invalid values fail releaseVersion().
      MOBILE_VERSION_NAME: ${{ inputs.versionName }}
      MOBILE_VERSION_CODE: ${{ inputs.versionCode }}
      DISPATCH_INPUT_SHA: ${{ inputs.sourceSha }}
      # #1300: public Google Web OAuth client ID (repository variable, not a secret); missing/invalid fails configure-android.mjs.
      MOBILE_GOOGLE_WEB_CLIENT_ID: ${{ vars.MOBILE_GOOGLE_WEB_CLIENT_ID }}
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx2g'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Resource and source preflight
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$DISPATCH_INPUT_SHA"
            test "$DISPATCH_INPUT_SHA" = "$EXPECTED_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          df -h .
          free -h
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 6291456
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Fundamental security checks
        run: node --test tests/mobile-poker-security.test.mjs tests/mobile-poker-preview.test.mjs tests/mobile-poker-audio.test.mjs tests/mobile-poker-channel.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: mobile/poker/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
      - name: Locked mobile dependencies
        working-directory: mobile/poker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Decrypt licensed lobby music (fails closed)
        working-directory: mobile/poker
        env:
          MOBILE_LOBBY_MUSIC_KEY: ${{ secrets.MOBILE_LOBBY_MUSIC_KEY }}
        run: node licensed-audio.mjs decrypt
      - name: Package shared frontend and generate Android template
        working-directory: mobile/poker
        run: |
          set -euo pipefail
          cp capacitor.production.json capacitor.config.json
          node package-web.mjs
          ./node_modules/.bin/cap add android
          node configure-android.mjs
          ./node_modules/.bin/cap sync android
          node -e '
            const fs = require("node:fs");
            const match = fs.readFileSync("android/variables.gradle", "utf8").match(/targetSdkVersion\s*=\s*(\d+)/);
            if (!match || Number(match[1]) < 36) {
              process.stderr.write("targetSdkVersion must be >= 36\n");
              process.exit(1);
            }
          '
      - name: Build release bundle
        working-directory: mobile/poker/android
        run: |
          set -euo pipefail
          df -h .
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 4194304
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 bundleRelease
      - name: Verify release AAB and assemble artifacts
        working-directory: mobile/poker
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          MOBILE_VERSION_NAME: ${{ env.MOBILE_VERSION_NAME }}
          MOBILE_VERSION_CODE: ${{ env.MOBILE_VERSION_CODE }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl -sSL "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" -o "$BUNDLETOOL_JAR"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $BUNDLETOOL_JAR" | sha256sum -c -

          mkdir artifacts
          AAB_SRC="android/app/build/outputs/bundle/release/app-release.aab"
          AAB_DEST="artifacts/arcade-poker-production-${MOBILE_VERSION_NAME}-${MOBILE_VERSION_CODE}-${SOURCE_SHA}-unsigned.aab"
          cp "$AAB_SRC" "$AAB_DEST"

          java -jar "$BUNDLETOOL_JAR" dump manifest --bundle "$AAB_DEST" > artifacts/manifest.txt
          node verify-android-diagnostics.mjs artifacts/manifest.txt production
          java -jar "$BUNDLETOOL_JAR" dump resources --bundle "$AAB_DEST" --resource string/poker_google_web_client_id --values > artifacts/google-signin-resource.txt
          grep -qF "$MOBILE_GOOGLE_WEB_CLIENT_ID" artifacts/google-signin-resource.txt

          cp www/build-receipt.json artifacts/
          (node --version; java -version 2>&1; cat android/variables.gradle; cat android/gradle/wrapper/gradle-wrapper.properties; ./android/gradlew -p android --version; df -h .) > artifacts/toolchain.txt

          export AAB_DEST="$AAB_DEST"
          node -e '
            const fs = require("node:fs");
            const cp = require("node:child_process");
            const crypto = require("node:crypto");

            const manifest = fs.readFileSync("artifacts/manifest.txt", "utf8");
            const aabPath = process.env.AAB_DEST;
            const expectedName = process.env.MOBILE_VERSION_NAME;
            const expectedCode = process.env.MOBILE_VERSION_CODE;

            // 1. Assert package="pl.kcswh.arcadepoker"
            const pkgMatch = manifest.match(/\bpackage="([^"]+)"/);
            if (!pkgMatch || pkgMatch[1] !== "pl.kcswh.arcadepoker") {
              throw new Error("Manifest package mismatch: expected pl.kcswh.arcadepoker, got " + (pkgMatch ? pkgMatch[1] : "none"));
            }

            // 2. versionCode/versionName equal to the env
            const vcMatch = manifest.match(/\b(?:android:)?versionCode="?(\d+)"?/);
            if (!vcMatch || vcMatch[1] !== expectedCode) {
              throw new Error("Manifest versionCode mismatch: expected " + expectedCode + ", got " + (vcMatch ? vcMatch[1] : "none"));
            }
            const vnMatch = manifest.match(/\b(?:android:)?versionName="?([^"\s>]+)"?/);
            if (!vnMatch || vnMatch[1] !== expectedName) {
              throw new Error("Manifest versionName mismatch: expected " + expectedName + ", got " + (vnMatch ? vnMatch[1] : "none"));
            }

            // 3. targetSdkVersion >= 36
            const targetSdkMatch = manifest.match(/\b(?:android:)?targetSdkVersion="?(\d+)"?/);
            if (!targetSdkMatch || Number(targetSdkMatch[1]) < 36) {
              throw new Error("Manifest targetSdkVersion must be >= 36, got " + (targetSdkMatch ? targetSdkMatch[1] : "none"));
            }
            const targetSdk = Number(targetSdkMatch[1]);

            const minSdkMatch = manifest.match(/\b(?:android:)?minSdkVersion="?(\d+)"?/);
            if (!minSdkMatch) throw new Error("Manifest minSdkVersion missing");
            const minSdk = Number(minSdkMatch[1]);

            // 4. no android:debuggable="true"
            if (manifest.includes("debuggable=\"true\"") || manifest.includes("debuggable=true")) {
              throw new Error("AAB manifest is debuggable");
            }

            // 5. One intent filter must carry the complete verified App Link callback.
            const filters = [...manifest.matchAll(/<intent-filter\b[^>]*>[\s\S]*?<\/intent-filter>/g)].map(m => m[0]);
            const has = (f, tag, attr, value) => new RegExp("<" + tag + "\\b[^>]*android:" + attr + "=\"" + value.replace(/\./g, "\\.") + "\"").test(f);
            const appLink = filters.filter(f => /^<intent-filter\b[^>]*android:autoVerify="true"/.test(f)
              && has(f, "action", "name", "android.intent.action.VIEW")
              && has(f, "category", "name", "android.intent.category.DEFAULT")
              && has(f, "category", "name", "android.intent.category.BROWSABLE")
              && has(f, "data", "scheme", "https") && has(f, "data", "host", "play.kcswh.pl")
              && has(f, "data", "path", "/app/auth/callback"));
            if (appLink.length !== 1) {
              throw new Error("Manifest must contain exactly one complete autoVerify App Link callback filter, found " + appLink.length);
            }

            // 6. contains no arcadepoker-stage
            if (manifest.includes("arcadepoker-stage")) {
              throw new Error("Manifest contains arcadepoker-stage");
            }

            // 7. Permissions and collection-off metadata have passed the shared final-manifest check.
            const permissions = [...manifest.matchAll(/<uses-permission(?:-sdk-\d+)?\b[^>]*\bandroid:name="([^"]+)"/g)].map(m => m[1]);

            // 8. Packaged config.js must equal the pinned Production endpoints exactly.
            const configJs = cp.execFileSync("unzip", ["-p", aabPath, "base/assets/public/mobile/config.js"], { encoding: "utf8" });
            const configMatch = configJs.match(/^window\.MOBILE_POKER_CONFIG = (\{.*\});\n$/s);
            if (!configMatch) throw new Error("Unexpected packaged config.js format");
            const packaged = JSON.parse(configMatch[1]);
            const pinned = JSON.parse(fs.readFileSync("production-public.json", "utf8"));
            for (const field of ["apiOrigin", "supabaseUrl", "wsUrl", "supabaseAnonKey"]) {
              if (packaged[field] !== pinned[field]) throw new Error("Packaged config.js " + field + " differs from production-public.json");
            }
            if (packaged.sha !== process.env.SOURCE_SHA) throw new Error("Packaged config.js sha differs from SOURCE_SHA");

            // 9. jarsigner -verify output must contain "jar is unsigned"
            const jarsignerOut = cp.execFileSync("jarsigner", ["-verify", aabPath], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
            if (!jarsignerOut.includes("jar is unsigned")) {
              throw new Error("jarsigner output missing \"jar is unsigned\":\n" + jarsignerOut);
            }

            // 10. Generate release-receipt.json
            const aabBytes = fs.readFileSync(aabPath);
            const aabSha256 = crypto.createHash("sha256").update(aabBytes).digest("hex");

            const releaseReceipt = {
              sourceSha: process.env.SOURCE_SHA,
              runId: Number(process.env.RUN_ID),
              runAttempt: Number(process.env.RUN_ATTEMPT),
              event: process.env.EVENT_NAME,
              channel: "production",
              appId: "pl.kcswh.arcadepoker",
              versionName: expectedName,
              versionCode: Number(expectedCode),
              minSdk,
              targetSdk,
              permissions,
              diagnostics: { provider: "firebase-crashlytics", manifestDefault: false, buildEligibility: false },
              aabSha256,
              signed: false,
              googleWebClientId: process.env.MOBILE_GOOGLE_WEB_CLIENT_ID,
              bundletool: {
                version: "1.18.3",
                sha256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
              }
            };
            fs.writeFileSync("artifacts/release-receipt.json", JSON.stringify(releaseReceipt, null, 2) + "\n");
          '

          (cd artifacts && sha256sum "$(basename "$AAB_DEST")" > SHA256SUMS)
          cat artifacts/release-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-poker-production-aab-unsigned-${{ env.MOBILE_VERSION_CODE }}-${{ env.SOURCE_SHA }}
          path: mobile/poker/artifacts/
          if-no-files-found: error
          retention-days: 7

  # #1302: sign the verified unsigned AAB of this same run with the Play upload key. Secrets exist only in the protected
  # android-signing Environment and only in the signing step; nothing is uploaded to Google Play.
  sign-aab:
    needs: release-aab
    # Re-runs skip signing (run approvals are not per attempt); dispatch a new run instead.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-signing
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.sourceSha }}
      MOBILE_VERSION_NAME: ${{ inputs.versionName }}
      MOBILE_VERSION_CODE: ${{ inputs.versionCode }}
      # Public SHA-256 of the Play UPLOAD certificate (not the Play App Signing certificate, not the OAuth SHA-1).
      # OWNER verifies it against Play Console -> App integrity -> Upload key certificate before first use.
      ANDROID_UPLOAD_CERT_SHA256: '29:0D:12:CA:4B:AE:71:56:AC:36:35:AE:D9:7B:F8:3D:C1:E1:DC:B7:F5:21:4E:75:A2:6C:89:1C:F2:70:58:7E'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.10+7.0.LTS'
      # GitHub auto-creates a referenced Environment without protection, so verify it before any secret is used.
      - name: Protected environment and OWNER approval (fails closed)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Run approvals are not per attempt, so only the first attempt may sign; re-runs need a new dispatch.
          [ "$RUN_ATTEMPT" = 1 ] || { echo "sign_aab_STOP rerun_not_allowed_dispatch_new_run"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
          node --input-type=module -e '
            import { environmentFailures, ownerApproved } from "./scripts/www-release-actions.mjs";
            const api = async path => {
              const r = await fetch("https://api.github.com/repos/krzysztofcal/arcadePlatform/" + path, { headers: { authorization: "Bearer " + process.env.GH_TOKEN, accept: "application/vnd.github+json" } });
              if (!r.ok) throw new Error("environment_api_" + r.status);
              return r.json();
            };
            if (process.env.GITHUB_REPOSITORY !== "krzysztofcal/arcadePlatform") throw new Error("repository_mismatch");
            const failures = environmentFailures(await api("environments/android-signing"), await api("environments/android-signing/deployment-branch-policies"), "krzysztofcal");
            if (failures.length) throw new Error(failures.join(","));
            if (!ownerApproved(await api("actions/runs/" + process.env.GITHUB_RUN_ID + "/approvals"), "android-signing", "krzysztofcal")) throw new Error("owner_environment_approval_missing");
            process.stdout.write("android-signing protected and approved by OWNER\n");
          '
      - uses: actions/download-artifact@v4
        with:
          name: arcade-poker-production-aab-unsigned-${{ inputs.versionCode }}-${{ inputs.sourceSha }}
          path: unsigned
      - name: Verify the unsigned artifact of this run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          UNSIGNED_AAB="unsigned/arcade-poker-production-${MOBILE_VERSION_NAME}-${MOBILE_VERSION_CODE}-${SOURCE_SHA}-unsigned.aab"
          test -f "$UNSIGNED_AAB"
          (cd unsigned && sha256sum -c SHA256SUMS)
          export UNSIGNED_AAB
          node -e '
            const fs = require("node:fs"), crypto = require("node:crypto");
            const r = JSON.parse(fs.readFileSync("unsigned/release-receipt.json", "utf8"));
            const sha = crypto.createHash("sha256").update(fs.readFileSync(process.env.UNSIGNED_AAB)).digest("hex");
            const expected = { sourceSha: process.env.SOURCE_SHA, runId: Number(process.env.RUN_ID), runAttempt: Number(process.env.RUN_ATTEMPT), channel: "production", appId: "pl.kcswh.arcadepoker", versionName: process.env.MOBILE_VERSION_NAME, versionCode: Number(process.env.MOBILE_VERSION_CODE), signed: false, aabSha256: sha };
            for (const [key, value] of Object.entries(expected)) if (r[key] !== value) throw new Error("unsigned_receipt_mismatch_" + key);
          '
          echo "UNSIGNED_AAB=$UNSIGNED_AAB" >> "$GITHUB_ENV"
      - name: Sign with the Play upload key (only step with signing secrets)
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          EXPECTED_UPLOAD_CERT_SHA256: ${{ env.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir signed
          SIGNED_AAB="signed/arcade-poker-production-${MOBILE_VERSION_NAME}-${MOBILE_VERSION_CODE}-${SOURCE_SHA}-signed.aab" bash mobile/poker/sign-release-aab.sh
      - name: Signed receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SIGNED_AAB="signed/arcade-poker-production-${MOBILE_VERSION_NAME}-${MOBILE_VERSION_CODE}-${SOURCE_SHA}-signed.aab"
          export SIGNED_AAB
          node -e '
            const fs = require("node:fs"), crypto = require("node:crypto");
            const hash = file => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            const receipt = { sourceSha: process.env.SOURCE_SHA, runId: Number(process.env.RUN_ID), runAttempt: Number(process.env.RUN_ATTEMPT), channel: "production", appId: "pl.kcswh.arcadepoker", versionName: process.env.MOBILE_VERSION_NAME, versionCode: Number(process.env.MOBILE_VERSION_CODE), signed: true, unsignedAabSha256: hash(process.env.UNSIGNED_AAB), signedAabSha256: hash(process.env.SIGNED_AAB), uploadCertificateSha256: process.env.ANDROID_UPLOAD_CERT_SHA256 };
            fs.writeFileSync("signed/signed-release-receipt.json", JSON.stringify(receipt, null, 2) + "\n");
          '
          (cd signed && sha256sum "$(basename "$SIGNED_AAB")" > SHA256SUMS)
          cat signed/signed-release-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-poker-production-aab-signed-${{ inputs.versionCode }}-${{ inputs.sourceSha }}
          path: signed/
          if-no-files-found: error
          retention-days: 7
