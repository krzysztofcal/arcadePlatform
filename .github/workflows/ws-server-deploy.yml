name: WS Server Deploy
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ws-server-${{ github.ref }}
  cancel-in-progress: false

env:
  WS_DOCKER_BUILD_CONTEXT: "."
  WS_DOCKERFILE_PATH: "ws-server/Dockerfile"
  WS_POKER_LOG_LEVEL: "INFO"

jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.paths.outputs.core }}
      web: ${{ steps.paths.outputs.web }}
      chips_db: ${{ steps.paths.outputs.chips_db }}
      ws_poker: ${{ steps.paths.outputs.ws_poker }}
      games: ${{ steps.paths.outputs.games }}
      infra: ${{ steps.paths.outputs.infra }}
      deploy_ws: ${{ steps.paths.outputs.deploy_ws }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Classify changed paths
        id: paths
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-impact.mjs --github-output "$GITHUB_OUTPUT"

  validate:
    needs: impact
    if: ${{ needs.impact.outputs.ws_poker == 'true' || needs.impact.outputs.deploy_ws == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install WS server dependencies
        run: npm ci --prefix ws-server

      - name: Run ws-server package runtime deps guard test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-server-package-runtime-deps.guard.test.mjs

      - name: Run shared poker join behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test shared/poker-domain/join.behavior.test.mjs

      - name: Run poker ws client behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test tests/poker-ws-client.test.mjs

      - name: Run poker table v2 live behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test tests/poker-v2-live.behavior.test.mjs

      - name: Run ws lobby join public snapshot behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-lobby-join-public-snapshot.behavior.test.mjs

      - name: Run ws join runtime behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-join-runtime.behavior.test.mjs


      - name: Validate shared WS Docker build contract (repo-root context)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          # Must stay aligned with ws-tests/ws-docker-build-contract.mjs and any real image build/push path in this workflow.
          docker build -t arcadeplatform-ws-contract:${{ github.sha }} -f "$WS_DOCKERFILE_PATH" "$WS_DOCKER_BUILD_CONTEXT"
          docker image rm -f arcadeplatform-ws-contract:${{ github.sha }}

      - name: Run WS behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/server.behavior.test.mjs

      - name: Run ws leave-race behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/server.leave-race.behavior.test.mjs

      - name: Run ws auth verifier behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/auth/verify-token.behavior.test.mjs

      - name: Run ws conn-state behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/runtime/conn-state.behavior.test.mjs

      - name: Run ws accepted bot autoplay adapter behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/runtime/accepted-bot-autoplay-adapter.behavior.test.mjs

      - name: Run ws table behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/table/table.behavior.test.mjs

      - name: Run ws table snapshot behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/table/table-snapshot.behavior.test.mjs

      - name: Run ws table manager behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/table/table-manager.behavior.test.mjs

      - name: Run persisted state writer behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/persistence/persisted-state-writer.behavior.test.mjs

      - name: Run authoritative leave adapter behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/persistence/authoritative-leave-adapter.behavior.test.mjs


      - name: Run persisted bootstrap adapter behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/bootstrap/persisted-bootstrap-adapter.behavior.test.mjs

      - name: Run persisted bootstrap repository behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/bootstrap/persisted-bootstrap-repository.behavior.test.mjs


      - name: Run ws poker engine bootstrap behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/engine/engine-bootstrap.behavior.test.mjs

      - name: Run ws poker engine act behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/engine/engine-act.behavior.test.mjs

      - name: Run ws poker engine rollover behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/engine/engine-rollover.behavior.test.mjs

      - name: Run ws poker engine timeout behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/engine/engine-timeout.behavior.test.mjs

      - name: Run ws core behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/core/core.behavior.test.mjs

      - name: Run room-core snapshot behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/read-model/room-core-snapshot.behavior.test.mjs

      - name: Run state-snapshot behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/read-model/state-snapshot.behavior.test.mjs

      - name: Run state-patch behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/read-model/state-patch.behavior.test.mjs

      - name: Run stream-log behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/runtime/stream-log.behavior.test.mjs

      - name: Run poker primitives behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/shared/poker-primitives.behavior.test.mjs

      - name: Run poker turn timeout behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/shared/poker-turn-timeout.behavior.test.mjs

      - name: Run poker action reducer behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/shared/poker-action-reducer.behavior.test.mjs

      - name: WS reconnect/resync regression tests
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/reconnect/resync.behavior.test.mjs

      - name: Run ws join handler behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/handlers/join.behavior.test.mjs

      - name: Run ws start-hand handler behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/handlers/start-hand.behavior.test.mjs

      - name: Run ws act handler behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-server/poker/handlers/act.behavior.test.mjs

      - name: Run workflow-content test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-deploy-workflow.test.mjs

      - name: Run ws auth workflow guard behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-ws-auth-workflow.guard.behavior.test.mjs

      - name: Run ws table workflow guard behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-table-workflow.guard.behavior.test.mjs

      - name: Run ws core workflow guard behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-core-workflow.guard.behavior.test.mjs

      - name: Run ws resync workflow guard behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-resync-workflow.guard.behavior.test.mjs

      - name: Run ws-server deploy workflow guard test
        run: node --test ws-tests/ws-server-deploy.workflow.guard.test.mjs

      - name: Run ws-server deploy remote-script behavior test
        run: node --test ws-tests/ws-server-deploy.remote-script.behavior.test.mjs

      - name: Run ws-server deploy health-gate retry behavior test
        run: node --test ws-tests/ws-server-deploy.health-gate-retry.behavior.test.mjs

      - name: Run ws-server deploy sudo-preflight guard test
        run: node --test ws-tests/ws-server-deploy.sudo-preflight.guard.test.mjs

      - name: Run ws-production-env-preflight behavior test
        run: node --test ws-tests/ws-production-env-preflight.behavior.test.mjs

      - name: Run ws-server deploy runner-smoke behavior test
        run: node --test ws-tests/ws-server-deploy.runner-smoke.behavior.test.mjs

      - name: Run ws-server deploy artifact path guard test
        run: node --test ws-tests/ws-server-deploy.artifact-path.guard.test.mjs

      - name: Run ws production deploy collision guard test
        run: node --test ws-tests/ws-production-deploy-collision.guard.test.mjs

      - name: Run ws-deploy no-prod-mutation-on-ws-tests guard test
        run: node --test ws-tests/ws-deploy.no-prod-mutation-on-ws-tests.guard.test.mjs

      - name: Run ws-deploy trigger-surface guard test
        run: node --test ws-tests/ws-deploy.trigger-surface.guard.test.mjs


      - name: Run ws-server deploy scp-contract behavior test
        run: node --test ws-tests/ws-server-deploy.scp-contract.behavior.test.mjs

      - name: Run ws-server deploy gated-by-validate guard test
        run: node --test ws-tests/ws-server-deploy.deploy-gated-by-validate.guard.test.mjs

      - name: Run ws-server deploy artifact-path harness test
        run: node --test ws-tests/ws-server-deploy-artifact-path.test.mjs

      - name: Run ws-server deploy rollout harness test
        run: node --test ws-tests/ws-server-deploy-rollout.test.mjs

      - name: Run ws mint-token no-postgres dependency guard test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-mint-token.no-postgres-dep.guard.test.mjs

      - name: Run ws mint-token behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-mint-token.behavior.test.mjs

      - name: Run ws mint-token test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-mint-token.test.mjs

      - name: Run ws table state payload test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-table-state-payload.test.mjs


      - name: Run ws auth token mint doc test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-auth-token-mint-doc.test.mjs


      - name: Run ws room-core snapshot dependency guard test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-room-core-snapshot-dependency.guard.test.mjs

      - name: Run ws terminal settlement runtime deps guard test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-terminal-settlement-runtime-deps.guard.test.mjs

      - name: Run lockfile integrity test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-lockfile-integrity.test.mjs

      - name: Run ws smoke-check script behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-smoke-check-script.behavior.test.mjs


      - name: Run ws image protocol content behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-image-contains-protocol.behavior.test.mjs

      - name: Run ws docker leave runtime guard test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-docker-leave-runtime.guard.test.mjs

      - name: Run ws container startup behavior test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-container-starts.behavior.test.mjs

      - name: Run ws-server deploy CodeQL URL substring guard test
        run: node --test ws-tests/ws-server-deploy.codeql-url-substring.guard.test.mjs

      - name: WS dependency graph guard test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-ws-dependency.guard.test.mjs

      - name: WS poker protocol compliance test
        if: ${{ github.event_name != 'pull_request' }}
        run: node --test ws-tests/ws-poker-protocol-compliance.test.mjs
  deploy:
    needs: [impact, validate]
    # #1018 T108 Production DB compatibility gate completed under owner GO.
    # Restore the normal main-push Production deployment path; manual dispatch remains available.
    if: ${{ needs.impact.outputs.deploy_ws == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      WS_REMOTE_TMP_DIR: /tmp/arcadeplatform-ws-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pre-stage shared deploy/maintenance lock on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WS_HOST }}
          username: ${{ secrets.WS_USER }}
          key: ${{ secrets.WS_SSH_KEY }}
          timeout: 2m
          command_timeout: 10m
          script: |
            set -eu
            if ! command -v bash >/dev/null 2>&1; then
              echo "bash is required on VPS"
              exit 1
            fi

            bash <<'BASH'
            set -Eeuo pipefail

            BASE_DIR="/opt/ws-server"
            RELEASES_DIR="$BASE_DIR/releases"
            LOCK_FILE="$BASE_DIR/.deploy-maintenance.lock"
            DEPLOY_GROUP="arcade-deploy"

            if [[ "$(id -un)" != "copilot" ]]; then
              echo "Production deploy must run as copilot"
              exit 1
            fi
            if ! test -d "$BASE_DIR" || test -L "$BASE_DIR" || ! test -w "$BASE_DIR" || ! test -x "$BASE_DIR"; then
              echo "production deploy root is not a writable directory"
              exit 1
            fi
            if ! test -d "$RELEASES_DIR" || test -L "$RELEASES_DIR" || ! test -w "$RELEASES_DIR" || ! test -x "$RELEASES_DIR"; then
              echo "production releases directory is not a writable directory"
              exit 1
            fi
            if [[ -L "$LOCK_FILE" ]]; then
              echo "deploy maintenance lock is a symlink"
              exit 1
            fi

            if [[ ! -e "$LOCK_FILE" ]]; then
              if ! ( umask 0007; set -o noclobber; : > "$LOCK_FILE" ) 2>/dev/null; then
                if [[ ! -f "$LOCK_FILE" || -L "$LOCK_FILE" ]]; then
                  echo "cannot create deploy maintenance lock"
                  exit 1
                fi
              fi
            fi

            if [[ ! -f "$LOCK_FILE" || -L "$LOCK_FILE" ]]; then
              echo "missing or unsafe deploy maintenance lock"
              exit 1
            fi

            verify_lock_fd() {
              local path_identity fd_identity
              [[ -f "$LOCK_FILE" && ! -L "$LOCK_FILE" ]]
              path_identity="$(stat -c '%d:%i:%h' -- "$LOCK_FILE")"
              fd_identity="$(stat -Lc '%d:%i:%h' -- "/proc/$$/fd/9")"
              [[ "$(stat -Lc '%h' -- "/proc/$$/fd/9")" == 1 ]]
              [[ "$path_identity" == "$fd_identity" ]]
            }

            if ! exec 9<> "$LOCK_FILE"; then
              echo "cannot open deploy maintenance lock"
              exit 1
            fi
            if ! verify_lock_fd; then
              echo "deploy maintenance lock changed while opening"
              exit 1
            fi
            if ! flock -w 300 9; then
              echo "deploy maintenance lock is unavailable or busy"
              exit 1
            fi
            if ! verify_lock_fd; then
              echo "deploy maintenance lock changed while waiting"
              exit 1
            fi

            lock_owner="$(stat -Lc '%U' -- "/proc/$$/fd/9")"
            if [[ "$lock_owner" != root && "$lock_owner" != copilot ]]; then
              echo "deploy maintenance lock has an unexpected owner"
              exit 1
            fi
            lock_group="$(stat -Lc '%G' -- "/proc/$$/fd/9")"
            if [[ "$lock_group" != "$DEPLOY_GROUP" ]]; then
              chgrp "$DEPLOY_GROUP" "/proc/$$/fd/9"
            fi
            if [[ "$(stat -Lc '%a' -- "/proc/$$/fd/9")" != 660 ]]; then
              chmod 0660 "/proc/$$/fd/9"
            fi
            [[ "$(stat -Lc '%G' -- "/proc/$$/fd/9")" == "$DEPLOY_GROUP" ]]
            [[ "$(stat -Lc '%a' -- "/proc/$$/fd/9")" == 660 ]]
            BASH

      - name: Build and package ws-server deploy artifact
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
          RELEASE_ENVIRONMENT: production
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$GITHUB_WORKSPACE/.artifacts/ws-server"
          STAGE_ROOT="$ARTIFACT_DIR/stage"
          STAGE_WS_DIR="$STAGE_ROOT/ws-server"
          ARTIFACT_FILE="$ARTIFACT_DIR/ws-server-dist.tgz"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$STAGE_WS_DIR"

          npm ci --prefix ws-server
          npm run --prefix ws-server build --if-present

          rm -rf ws-server/node_modules
          npm ci --prefix ws-server --omit=dev

          cp ws-server/package.json "$STAGE_WS_DIR"/
          cp ws-server/package-lock.json "$STAGE_WS_DIR"/
          cp -R ws-server/node_modules "$STAGE_WS_DIR"/node_modules
          ln -s ws-server/node_modules "$STAGE_ROOT/node_modules"

          if [ -d ws-server/dist ]; then
            cp -R ws-server/dist "$STAGE_WS_DIR"/dist
          fi

          if [ -f ws-server/server.mjs ]; then
            cp ws-server/server.mjs "$STAGE_WS_DIR"/
          fi
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ releaseSha: process.env.RELEASE_SHA, deployRef: process.env.DEPLOY_REF, environment: process.env.RELEASE_ENVIRONMENT }) + "\n")' "$STAGE_WS_DIR/release-metadata.json"

          if [ -d ws-server/poker ]; then
            cp -R ws-server/poker "$STAGE_WS_DIR"/poker
          fi

          if [ -d ws-server/observability ]; then
            cp -R ws-server/observability "$STAGE_WS_DIR"/observability
          fi

          if [ -d ws-server/shared ]; then
            cp -R ws-server/shared "$STAGE_WS_DIR"/shared
          fi

          if [ -d shared ]; then
            cp -R shared "$STAGE_ROOT"/shared
          fi

          if [ -d netlify/functions/_shared ]; then
            mkdir -p "$STAGE_ROOT"/netlify/functions/_shared
            cp netlify/functions/_shared/chips-ledger.mjs "$STAGE_ROOT"/netlify/functions/_shared/
            cp netlify/functions/_shared/poker-*.mjs "$STAGE_ROOT"/netlify/functions/_shared/
            cp netlify/functions/_shared/supabase-admin.mjs "$STAGE_ROOT"/netlify/functions/_shared/
            cp netlify/functions/_shared/api-cors.mjs "$STAGE_ROOT"/netlify/functions/_shared/
            mkdir -p "$STAGE_ROOT"/netlify/functions/_generated
            cp netlify/functions/_generated/deploy-context.mjs "$STAGE_ROOT"/netlify/functions/_generated/
          fi

          test -f "$STAGE_WS_DIR/server.mjs"
          test -f "$STAGE_WS_DIR/release-metadata.json"
          test -f "$STAGE_ROOT/shared/profile-avatar-projection.mjs"
          test -f "$STAGE_ROOT/netlify/functions/_shared/chips-ledger.mjs"
          test -f "$STAGE_ROOT/netlify/functions/_shared/api-cors.mjs"
          test -f "$STAGE_ROOT/netlify/functions/_generated/deploy-context.mjs"
          test -d "$STAGE_ROOT/node_modules/postgres"
          (
            cd "$STAGE_ROOT"
            node --input-type=module -e "await import('./ws-server/poker/read-model/public-poker-identity.mjs')"
            node --input-type=module -e "await import('./ws-server/shared/poker-domain/inactive-cleanup-deps.mjs')"
          )

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$ARTIFACT_FILE" \
            -C "$STAGE_ROOT" \
            .

      - name: Upload ws-server artifact to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WS_HOST }}
          username: ${{ secrets.WS_USER }}
          key: ${{ secrets.WS_SSH_KEY }}
          source: .artifacts/ws-server/ws-server-dist.tgz
          target: ${{ env.WS_REMOTE_TMP_DIR }}

      - name: Atomic release switch + restart + health gate on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
          WS_REMOTE_TMP_DIR: ${{ env.WS_REMOTE_TMP_DIR }}
        with:
          host: ${{ secrets.WS_HOST }}
          username: ${{ secrets.WS_USER }}
          key: ${{ secrets.WS_SSH_KEY }}
          timeout: 2m
          command_timeout: 20m
          envs: RELEASE_SHA,WS_REMOTE_TMP_DIR
          script: |
            set -eu
            if ! command -v bash >/dev/null 2>&1; then
              echo "bash is required on VPS"
              exit 1
            fi

            bash <<'BASH'
            set -Eeuo pipefail

            BASE_DIR="/opt/ws-server"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            DEPLOY_MAINTENANCE_LOCK="/opt/ws-server/.deploy-maintenance.lock"
            if [[ "$(id -un)" != "copilot" ]]; then
              echo "Production deploy must run as copilot"
              exit 1
            fi
            if [[ ! "$WS_REMOTE_TMP_DIR" =~ ^/tmp/arcadeplatform-ws-[0-9]+-[0-9]+$ ]]; then
              echo "invalid run-scoped production temp dir: $WS_REMOTE_TMP_DIR"
              exit 1
            fi

            TMP_ARCHIVE="$WS_REMOTE_TMP_DIR/.artifacts/ws-server/ws-server-dist.tgz"
            if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "invalid Production release SHA"
              exit 1
            fi
            RELEASE_ID="$RELEASE_SHA"
            NEW_RELEASE_DIR="$RELEASES_DIR/$RELEASE_ID"
            NEW_RELEASE_APP_DIR="$NEW_RELEASE_DIR/ws-server"
            PREVIOUS_TARGET=""
            HAVE_SWITCHED=0
            HEALTH_RETRIES=30
            HEALTH_SLEEP_SEC=1

            cleanup() {
              rm -rf -- "$WS_REMOTE_TMP_DIR" >/dev/null 2>&1 || true
            }

            trap cleanup EXIT

            if ! command -v node >/dev/null 2>&1; then
              echo "install nodejs"
              exit 1
            fi

            if ! command -v systemctl >/dev/null 2>&1; then
              echo "provision unit first"
              exit 1
            fi

            if ! systemctl cat ws-server.service >/dev/null 2>&1; then
              echo "missing ws-server.service unit"
              exit 1
            fi

            if ! test -d "$BASE_DIR" || test -L "$BASE_DIR" || ! test -w "$BASE_DIR"; then
              echo "provision deploy root paths first"
              exit 1
            fi

            if ! test -d "$RELEASES_DIR" || test -L "$RELEASES_DIR" || ! test -w "$RELEASES_DIR" || ! test -w "$BASE_DIR"; then
              echo "provision deploy group paths first"
              exit 1
            fi

            if ! [[ -f "$DEPLOY_MAINTENANCE_LOCK" && ! -L "$DEPLOY_MAINTENANCE_LOCK" ]]; then
              echo "missing or unsafe deploy maintenance lock"
              exit 1
            fi

            verify_lock_fd() {
              local path_identity fd_identity
              [[ -f "$DEPLOY_MAINTENANCE_LOCK" && ! -L "$DEPLOY_MAINTENANCE_LOCK" ]]
              path_identity="$(stat -c '%d:%i:%h' -- "$DEPLOY_MAINTENANCE_LOCK")"
              fd_identity="$(stat -Lc '%d:%i:%h' -- "/proc/$$/fd/9")"
              [[ "$(stat -Lc '%h' -- "/proc/$$/fd/9")" == 1 ]]
              [[ "$path_identity" == "$fd_identity" ]]
            }

            if ! exec 9<> "$DEPLOY_MAINTENANCE_LOCK"; then
              echo "cannot open deploy maintenance lock"
              exit 1
            fi
            if ! verify_lock_fd; then
              echo "deploy maintenance lock changed while opening"
              exit 1
            fi

            if ! flock -w 300 9; then
              echo "deploy maintenance lock is unavailable or busy"
              exit 1
            fi
            if ! verify_lock_fd; then
              echo "deploy maintenance lock changed while waiting"
              exit 1
            fi

            rollback() {
              if [ "$HAVE_SWITCHED" != "1" ] || [ -z "$PREVIOUS_TARGET" ]; then
                return 0
              fi
              ln -sfn "$PREVIOUS_TARGET" "$CURRENT_LINK.tmp"
              mv -Tf "$CURRENT_LINK.tmp" "$CURRENT_LINK"
              sudo -n /usr/bin/systemctl restart ws-server.service || true
            }

            on_error() {
              rc=$?
              rollback
              exit "$rc"
            }

            trap 'on_error' ERR

            test -f "$TMP_ARCHIVE"

            if [ -L "$CURRENT_LINK" ] || [ -e "$CURRENT_LINK" ]; then
              PREVIOUS_TARGET="$(readlink -f "$CURRENT_LINK" || true)"
            fi

            rm -rf "$NEW_RELEASE_DIR"
            mkdir -p "$NEW_RELEASE_DIR"
            tar -xzf "$TMP_ARCHIVE" -C "$NEW_RELEASE_DIR"
            test -f "$NEW_RELEASE_APP_DIR/server.mjs"
            test -f "$NEW_RELEASE_APP_DIR/observability/vps-metrics.mjs"
            test -f "$NEW_RELEASE_DIR/shared/profile-avatar-projection.mjs"
            test -f "$NEW_RELEASE_DIR/netlify/functions/_shared/chips-ledger.mjs"
            test -d "$NEW_RELEASE_DIR/node_modules/postgres"

            DEPLOYED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            if [[ ! "$DEPLOYED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "invalid deployment timestamp"
              exit 1
            fi
            if [[ $(date -u -d "$DEPLOYED_AT" '+%Y-%m-%dT%H:%M:%SZ') != "$DEPLOYED_AT" ]]; then
              echo "non-canonical deployment timestamp"
              exit 1
            fi
            printf '%s\n' "$DEPLOYED_AT" > "$NEW_RELEASE_DIR/.deployed-at"
            chmod 0644 "$NEW_RELEASE_DIR/.deployed-at"
            if [[ $(cat "$NEW_RELEASE_DIR/.deployed-at") != "$DEPLOYED_AT" ]]; then
              echo "deployment timestamp marker verification failed"
              exit 1
            fi

            sudo -n /usr/local/sbin/arcade-ws-production-env-preflight

            ln -sfn "$NEW_RELEASE_APP_DIR" "$CURRENT_LINK.tmp"
            mv -Tf "$CURRENT_LINK.tmp" "$CURRENT_LINK"
            HAVE_SWITCHED=1

            sudo -n /usr/bin/systemctl restart ws-server.service

            LOCAL_HEALTHZ_BODY=""
            for i in $(seq 1 "$HEALTH_RETRIES"); do
              if LOCAL_HEALTHZ_BODY="$(curl -fsS http://127.0.0.1:3000/healthz 2>/dev/null | tr -d '\r\n')" && [ "$LOCAL_HEALTHZ_BODY" = "ok" ]; then
                break
              fi
              if [ "$i" -eq "$HEALTH_RETRIES" ]; then
                echo "local healthz failed after retries"
                false
              fi
              sleep "$HEALTH_SLEEP_SEC"
            done

            HEALTHZ_BODY=""
            for i in $(seq 1 "$HEALTH_RETRIES"); do
              if HEALTHZ_BODY="$(curl -fsS https://ws.kcswh.pl/healthz 2>/dev/null | tr -d '\r\n')" && [ "$HEALTHZ_BODY" = "ok" ]; then
                break
              fi
              if [ "$i" -eq "$HEALTH_RETRIES" ]; then
                echo "public healthz failed after retries"
                false
              fi
              sleep "$HEALTH_SLEEP_SEC"
            done

            trap - ERR
            BASH
            rc=$?
            if [ "$rc" != "0" ]; then
              exit "$rc"
            fi

      - name: Smoke-check ws.kcswh.pl WebSocket handshake from runner
        run: |
          set -euo pipefail
          timeout 15s node <<'NODE'
          const tls = require('tls');
          const crypto = require('crypto');

          const host = 'ws.kcswh.pl';
          const path = '/ws';
          const wsKey = crypto.randomBytes(16).toString('base64');
          const expectedAccept = crypto.createHash('sha1').update(`${wsKey}258EAFA5-E914-47DA-95CA-C5AB0DC85B11`).digest('base64');
          const helloPayload = JSON.stringify({ version: '1.0', type: 'hello', ts: new Date().toISOString(), payload: { supportedVersions: ['1.0'] } });

          let stage = 'connect';
          let statusLine = '';
          let wsAccept = '';

          function fail(reason) {
            console.error(`ws-smoke fail stage=${stage} reason=${reason} status=${statusLine || 'n/a'} accept=${wsAccept || 'n/a'}`);
            finish(1);
          }

          function maskedTextFrame(payload) {
            const data = Buffer.from(payload, 'utf8');
            const mask = crypto.randomBytes(4);
            let header;
            if (data.length < 126) {
              header = Buffer.from([0x81, 0x80 | data.length]);
            } else if (data.length < 65536) {
              header = Buffer.alloc(4);
              header[0] = 0x81;
              header[1] = 0x80 | 126;
              header.writeUInt16BE(data.length, 2);
            } else {
              fail('payload-too-large');
              return Buffer.alloc(0);
            }
            const masked = Buffer.alloc(data.length);
            for (let i = 0; i < data.length; i += 1) masked[i] = data[i] ^ mask[i % 4];
            return Buffer.concat([header, mask, masked]);
          }

          function unmask(payload, mask) {
            const out = Buffer.alloc(payload.length);
            for (let i = 0; i < payload.length; i += 1) out[i] = payload[i] ^ mask[i % 4];
            return out;
          }

          const socket = tls.connect({ host, port: 443, servername: host }, () => {
            stage = 'handshake';
            const req = [
              `GET ${path} HTTP/1.1`,
              `Host: ${host}`,
              'Upgrade: websocket',
              'Connection: Upgrade',
              `Sec-WebSocket-Key: ${wsKey}`,
              'Sec-WebSocket-Version: 13',
              '',
              ''
            ].join('\r\n');
            socket.write(req);
          });

          let done = false;
          let buffer = Buffer.alloc(0);
          const timer = setTimeout(() => fail('timeout'), 5000);

          function finish(code) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            socket.destroy();
            process.exit(code);
          }

          function parseFrames() {
            while (buffer.length >= 2) {
              const b1 = buffer[0];
              const b2 = buffer[1];
              const opcode = b1 & 0x0f;
              const masked = (b2 & 0x80) !== 0;
              let offset = 2;
              let length = b2 & 0x7f;

              if (length === 126) {
                if (buffer.length < offset + 2) return;
                length = buffer.readUInt16BE(offset);
                offset += 2;
              } else if (length === 127) {
                fail('unsupported-frame-length');
                return;
              }

              const maskBytes = masked ? 4 : 0;
              if (buffer.length < offset + maskBytes + length) return;
              const mask = masked ? buffer.subarray(offset, offset + 4) : null;
              offset += maskBytes;
              let payload = buffer.subarray(offset, offset + length);
              buffer = buffer.subarray(offset + length);

              if (masked && mask) payload = unmask(payload, mask);
              if (opcode === 0x1) {
                const msg = payload.toString('utf8');
                if (msg.includes('"type":"helloAck"')) return finish(0);
              }
            }
          }

          socket.on('data', (chunk) => {
            buffer = Buffer.concat([buffer, chunk]);

            if (stage === 'handshake') {
              const idx = buffer.indexOf('\r\n\r\n');
              if (idx === -1) return;

              const head = buffer.subarray(0, idx).toString('utf8');
              const lines = head.split('\r\n');
              statusLine = lines[0] || '';
              const headers = new Map();
              for (let i = 1; i < lines.length; i += 1) {
                const pos = lines[i].indexOf(':');
                if (pos > 0) headers.set(lines[i].slice(0, pos).trim().toLowerCase(), lines[i].slice(pos + 1).trim());
              }

              wsAccept = headers.get('sec-websocket-accept') || '';
              if (!statusLine.includes('101')) return fail('unexpected-status');
              if (wsAccept !== expectedAccept) return fail('invalid-accept-header');

              buffer = buffer.subarray(idx + 4);
              stage = 'frames';
              socket.write(maskedTextFrame(helloPayload));
            }

            if (stage === 'frames') parseFrames();
          });

          socket.on('error', (err) => fail(`socket-error:${err && err.code ? err.code : 'unknown'}`));
          socket.on('end', () => fail('socket-end-before-helloAck'));
          NODE
