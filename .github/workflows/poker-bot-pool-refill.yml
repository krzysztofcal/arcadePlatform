name: Poker Bot Pool Refill

on:
  workflow_dispatch:
    inputs:
      target:
        description: Ledger target
        required: true
        default: stage
        type: choice
        options:
          - stage
          - production
      mode:
        description: Read-only preview or explicitly authorized mutation
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - mutate
      operation:
        description: Bounded refill operation
        required: true
        default: refill
        type: choice
        options:
          - refill
          - initial-seed-all
      reviewed_ref:
        description: Immutable reviewed ref; Stage mutation requires the exact 40-character PR SHA, Production requires main
        required: true
        default: main
        type: string
      confirmation_sha:
        description: Exact 40-character commit SHA matching HEAD, required for initial-seed-all mutation
        required: false
        default: ''
        type: string

concurrency:
  group: poker-bot-pool-refill-${{ inputs.target }}-${{ inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refill:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'krzysztofcal/arcadePlatform' && github.event.repository.fork != true && ((inputs.operation != 'initial-seed-all' && (inputs.target == 'stage' || github.ref == 'refs/heads/main') && (inputs.mode == 'dry-run' || (inputs.mode == 'mutate' && vars.POKER_BOT_REFILL_ENABLED == '1' && github.actor == vars.POKER_BOT_REFILL_DISPATCH_ACTOR && github.actor == 'arcade-poker-refill-dispatch'))) || (inputs.operation == 'initial-seed-all' && inputs.target == 'production' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.actor == 'krzysztofcal' && (inputs.mode == 'dry-run' || (inputs.mode == 'mutate' && vars.POKER_BOT_REFILL_ENABLED == '1' && vars.POKER_BOT_REFILL_PRODUCTION_GO == '1')))) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'production-poker-refill' || 'stage-poker-refill' }}
    timeout-minutes: 15
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      POKER_BOT_REFILL_REVIEWED_REF: ${{ inputs.target == 'production' && 'main' || inputs.reviewed_ref }}
      POKER_BOT_REFILL_TARGET: ${{ inputs.target }}
      POKER_BOT_REFILL_MODE: ${{ inputs.mode }}
      POKER_BOT_REFILL_OPERATION: ${{ inputs.operation || 'refill' }}
      POKER_BOT_REFILL_INITIAL_SEED_CONFIRMATION: ${{ inputs.confirmation_sha || '' }}
      POKER_BOT_REFILL_FEATURE_ENABLED: ${{ vars.POKER_BOT_REFILL_ENABLED || '0' }}
      POKER_BOT_REFILL_PRODUCTION_GO: ${{ vars.POKER_BOT_REFILL_PRODUCTION_GO || '0' }}
      SUPABASE_DB_URL: ${{ inputs.target == 'production' && secrets.SUPABASE_PROD_DB_URL || secrets.SUPABASE_STAGE_DB_URL }}
    steps:
      - name: Checkout exact dispatch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target == 'production' && 'main' || inputs.reviewed_ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify refill authority boundary
        shell: bash
        env:
          REFILL_TARGET: ${{ inputs.target }}
          REFILL_MODE: ${{ inputs.mode }}
          REFILL_OPERATION: ${{ inputs.operation || 'refill' }}
          CONFIRMATION_SHA_INPUT: ${{ inputs.confirmation_sha || '' }}
          REVIEWED_REF_INPUT: ${{ inputs.reviewed_ref }}
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse --verify HEAD)"
          reviewed_ref="${REVIEWED_REF_INPUT,,}"
          test "$GITHUB_REPOSITORY" = "krzysztofcal/arcadePlatform"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$REFILL_TARGET" = "stage" || test "$REFILL_TARGET" = "production"
          test "$REFILL_MODE" = "dry-run" || test "$REFILL_MODE" = "mutate"
          test "$REFILL_OPERATION" = "refill" || test "$REFILL_OPERATION" = "initial-seed-all"

          if [[ "$REFILL_OPERATION" == "initial-seed-all" ]]; then
            test "$REFILL_TARGET" = "production"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$REVIEWED_REF_INPUT" = "main"
            test "$checked_sha" = "$GITHUB_SHA"
            test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
            test "$GITHUB_ACTOR" = "krzysztofcal"
            test "$GITHUB_ACTOR" != "arcade-poker-refill-dispatch"
            if [[ "$REFILL_MODE" == "mutate" ]]; then
              test "${POKER_BOT_REFILL_FEATURE_ENABLED:-0}" = "1"
              test "${POKER_BOT_REFILL_PRODUCTION_GO:-0}" = "1"
              [[ "$CONFIRMATION_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
              test "$CONFIRMATION_SHA_INPUT" = "$checked_sha"
              test "$CONFIRMATION_SHA_INPUT" = "$GITHUB_SHA"
            fi
          else
            if [[ "$REFILL_TARGET" == "production" ]]; then
              test "$GITHUB_REF" = "refs/heads/main"
              test "$REVIEWED_REF_INPUT" = "main"
              test "$checked_sha" = "$GITHUB_SHA"
            elif [[ "$REFILL_MODE" == "mutate" ]]; then
              [[ "$reviewed_ref" =~ ^[0-9a-f]{40}$ ]]
              test "$GITHUB_SHA" = "$reviewed_ref"
              test "$reviewed_ref" = "$checked_sha"
            else
              test "$REVIEWED_REF_INPUT" = "main" || [[ "$reviewed_ref" =~ ^[0-9a-f]{40}$ ]]
            fi
            if [[ "$REFILL_MODE" == "mutate" ]]; then
              test "${POKER_BOT_REFILL_FEATURE_ENABLED:-0}" = "1"
              test "$GITHUB_ACTOR" = "${{ vars.POKER_BOT_REFILL_DISPATCH_ACTOR }}"
              test "$GITHUB_ACTOR" = "arcade-poker-refill-dispatch"
              if [[ "$REFILL_TARGET" == "production" ]]; then
                test "${POKER_BOT_REFILL_PRODUCTION_GO:-0}" = "1"
              fi
            fi
          fi
          echo "POKER_BOT_REFILL_CHECKED_SHA=$checked_sha" >> "$GITHUB_ENV"

      - name: Run bounded pool refill worker
        run: node scripts/ops/poker-bot-pool-refill.mjs
