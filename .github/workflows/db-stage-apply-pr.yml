name: DB Stage Apply PR

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/check-db-migrations.mjs"
      - "scripts/stage-db-migrate.mjs"
      - ".github/workflows/db-stage-apply-pr.yml"

concurrency:
  group: db-stage
  cancel-in-progress: false

jobs:
  apply-stage:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_STAGE_DB_URL: ${{ secrets.SUPABASE_STAGE_DB_URL }}
      SUPABASE_STAGE_PROJECT_REF: ${{ secrets.SUPABASE_STAGE_PROJECT_REF }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect migration changes
        id: changed
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "pull_request base/head SHA is invalid"
            exit 1
          fi

          checked_out_head="$(git rev-parse HEAD)"
          test "$checked_out_head" = "$PR_HEAD_SHA"

          git fetch --no-tags --prune --unshallow origin \
            "+$PR_BASE_SHA:refs/remotes/origin/pr-base" \
            "+$PR_HEAD_SHA:refs/remotes/origin/pr-head"
          test "$(git rev-parse refs/remotes/origin/pr-base)" = "$PR_BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$PR_HEAD_SHA"

          merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          test -n "$merge_base"
          echo "base_sha=$PR_BASE_SHA"
          echo "head_sha=$PR_HEAD_SHA"
          echo "merge_base=$merge_base"

          count="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" -- supabase/migrations | wc -l | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "migration files changed: $count"

      - name: Validate stage migration secrets
        if: ${{ steps.changed.outputs.count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_STAGE_DB_URL"
          test -n "$SUPABASE_STAGE_PROJECT_REF"
          case "$SUPABASE_STAGE_DB_URL" in
            *"$SUPABASE_STAGE_PROJECT_REF"*) ;;
            *) echo "SUPABASE_STAGE_DB_URL must target SUPABASE_STAGE_PROJECT_REF"; exit 1 ;;
          esac

      - name: Install PostgreSQL client
        if: ${{ steps.changed.outputs.count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate migration files
        if: ${{ steps.changed.outputs.count != '0' }}
        run: node scripts/check-db-migrations.mjs

      - name: Apply PR migrations to shared stage DB
        if: ${{ steps.changed.outputs.count != '0' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/stage-db-migrate.mjs --apply --changed-from "$PR_BASE_SHA"

      - name: No migration changes
        if: ${{ steps.changed.outputs.count == '0' }}
        run: echo "No supabase/migrations changes detected; stage DB apply skipped."
