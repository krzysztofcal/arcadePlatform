name: DB Stage Apply PR

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'JSON: pr, sourceSha, historyCount, historySha256, migrations [{file,sha256}]'
        required: true
        type: string
      operation:
        description: Explicit operation (inspect never initializes history)
        required: true
        default: inspect
        type: choice
        options: [inspect, apply]
      confirmation:
        description: Exact APPLY project sourceSHA approvalSHA256 phrase (apply only)
        required: false
        type: string

concurrency:
  group: db-stage
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  apply-stage:
    # Only OWNER may dispatch/rerun apply; the phrase pins the approved scope.
    # Both original dispatch and any rerun must be OWNER-authenticated.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'inspect' || (inputs.operation == 'apply' && github.actor == 'krzysztofcal' && github.triggering_actor == 'krzysztofcal')) }}
    runs-on: [self-hosted, linux, x64, stage-db-ipv6]
    env:
      STAGE_MIGRATION_BUNDLE: ${{ github.workspace }}/.stage-migration-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Checkout trusted workflow revision only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/stage-db-migrate.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare approved SQL as data (no Stage credentials)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGE_MIGRATION_APPROVAL: ${{ inputs.approval }}
        run: node scripts/stage-db-migrate.mjs --prepare
      - name: Read-only Stage inspect
        if: ${{ inputs.operation == 'inspect' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_STAGE_DB_URL: ${{ secrets.SUPABASE_STAGE_DIRECT_DB_URL }}
          SUPABASE_STAGE_PROJECT_REF: ${{ secrets.SUPABASE_STAGE_PROJECT_REF }}
        run: node scripts/stage-db-migrate.mjs --inspect
      - name: Apply exact approved set atomically
        if: ${{ inputs.operation == 'apply' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_STAGE_DB_URL: ${{ secrets.SUPABASE_STAGE_DIRECT_DB_URL }}
          SUPABASE_STAGE_PROJECT_REF: ${{ secrets.SUPABASE_STAGE_PROJECT_REF }}
          STAGE_MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/stage-db-migrate.mjs --apply
