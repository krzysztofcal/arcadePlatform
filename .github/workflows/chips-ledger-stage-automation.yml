name: Chips Ledger Stage Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage automation mode
        required: true
        default: existing-30d
        type: choice
        options:
          - existing-30d
          - bot-only-7d-prepare-only
          - legacy-stage-allowlist-prepare-only
          - audit-batch-13
          - execute-batch-13
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: chips-ledger-stage-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage-archive:
    if: ${{ vars.CHIPS_LEDGER_STAGE_AUTOMATION_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_STAGE_DB_URL: ${{ secrets.SUPABASE_STAGE_DB_URL }}
      SUPABASE_STAGE_URL: ${{ secrets.SUPABASE_STAGE_URL }}
      SUPABASE_STAGE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve checked-out commit
        id: checkout-sha
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Read-only Stage fence preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bot-only-7d-prepare-only' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const EXPECTED_SYSTEM_IDENTIFIER = "7656985631720456337";
          const isTrue = (value) => value === true || value === "t";
          const sql = postgres(process.env.SUPABASE_STAGE_DB_URL, {
            max: 1,
            prepare: false,
            connect_timeout: 10,
            idle_timeout: 0,
          });

          try {
            await sql.begin(async (tx) => {
              await tx.unsafe("set transaction read only");

              const identityRows = await tx.unsafe(
                "select system_identifier::text as system_identifier from pg_catalog.pg_control_system();",
              );
              if (identityRows[0]?.system_identifier !== EXPECTED_SYSTEM_IDENTIFIER) {
                throw new Error("Stage system identifier preflight mismatch");
              }

              const activeRows = await tx.unsafe(
                "select public.chips_table_fence_is_active() as active;",
              );
              if (!isTrue(activeRows[0]?.active)) {
                throw new Error("Stage TABLE fence is not active");
              }

              const controlRows = await tx.unsafe(
                "select enforcement_active from public.chips_table_fence_control where control_id is true;",
              );
              if (controlRows.length !== 1 || !isTrue(controlRows[0]?.enforcement_active)) {
                throw new Error("Stage TABLE fence control is not active");
              }
            });
          } finally {
            await sql.end({ timeout: 5 });
          }

          process.stdout.write("Stage read-only fence preflight passed\n");
          NODE

      - name: Run existing 30-day Stage automation
        if: ${{ github.event_name == 'schedule' || inputs.mode == '' || inputs.mode == 'existing-30d' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
        run: node scripts/ops/chips-ledger-stage-automation.mjs

      - name: Run bot-only 7-day prepare-only Stage automation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bot-only-7d-prepare-only' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/ops/chips-ledger-stage-automation.mjs \
            --policy bot-only-7d \
            --prepare-only

      - name: Run legacy Stage allowlist prepare-only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'legacy-stage-allowlist-prepare-only' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
        run: node scripts/ops/chips-ledger-legacy-stage-allowlist.mjs

      - name: Audit legacy Stage allowlist batch 13
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'audit-batch-13' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
        run: node scripts/ops/chips-ledger-legacy-stage-allowlist-audit.mjs

      - name: Execute approved legacy Stage batch 13
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'execute-batch-13' }}
        env:
          DEPLOYED_COMMIT_SHA: ${{ steps.checkout-sha.outputs.sha }}
          CHIPS_LEDGER_LEGACY_STAGE_ALLOWLIST_EXECUTE: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOYED_COMMIT_SHA" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import postgres from "postgres";
          import {
            assertLegacyStageAllowlistRegistryRows,
            hashLegacyStageAllowlistRegistryKeys,
            legacyStageAllowlistRegistryPredicate,
          } from "./scripts/ops/chips-ledger-legacy-stage-allowlist-registry.mjs";

          const EXPECTED = Object.freeze({
            projectRef: "krydukthwdvccggbyjfw",
            systemIdentifier: "7656985631720456337",
            batchId: "13",
            objectPath: "v1/sha256/a7ff21fef10b1d22b963793d3cf6efd667319a7211ee47c7e6f755f293155e60.jsonl.gz",
            archiveSha256: "a7ff21fef10b1d22b963793d3cf6efd667319a7211ee47c7e6f755f293155e60",
            cutoff: "2026-08-17 16:51:28.074+00",
            sourcePolicyId: "legacy_stage_allowlist_v1",
            sourceRun: "32753223679",
            querySha256: "9bd27ff7a2749a879707e823982f708e6abf86beffcdf8f97c5deac05f00ca09",
            masterAllowlistSha256: "611ab69ba8ee160a4957f8fe9514c919b9f4129bc1ea7842778b04d28ea6ca05",
            batchTableIdsSha256: "ded0a77efe84f56d2f4a9706f9d454a09179f6328098ad60ecf45639b4b75895",
            transactionIdsSha256: "23572e092abe6dee44e3537b8552cab3eb663e69370435c6205864c62f2bf9da",
            entryIdsSha256: "793e1993e45c198c476e1b5926c252542219c1cb7038e09ae96d440600d29a79",
            registryKeysSha256: "621e2d102ee65813e9554cbd3e2c4c79cc5ad1cbcc71c0c10cb8e948182ee81b",
            transactionCount: 60,
            entryCount: 120,
            registryCount: 60,
          });

          const fail = (message) => { throw new Error(`execute-batch-13 preflight: ${message}`); };
          const text = (value) => value == null ? "" : String(value).trim();
          const sql = postgres(process.env.SUPABASE_STAGE_DB_URL, {
            max: 1,
            prepare: false,
            connect_timeout: 10,
            idle_timeout: 0,
          });

          try {
            await sql.begin(async (tx) => {
              await tx.unsafe("set transaction isolation level repeatable read, read only;");
              const identity = await tx.unsafe("select system_identifier::text as system_identifier from pg_catalog.pg_control_system();");
              if (text(identity[0]?.system_identifier) !== EXPECTED.systemIdentifier) fail("system identifier mismatch");
              const active = await tx.unsafe("select public.chips_table_fence_is_active() as active;");
              if (!(active[0]?.active === true || active[0]?.active === "t")) fail("TABLE fence is not active");
              const control = await tx.unsafe("select enforcement_active from public.chips_table_fence_control where control_id is true;");
              if (control.length !== 1 || !(control[0]?.enforcement_active === true || control[0]?.enforcement_active === "t")) fail("fence enforcement is not active");

              const batches = await tx.unsafe(`
                select
                  object_path, batch_id::text as batch_id, project_ref, source_policy_id,
                  format_version::text as format_version, cutoff::text as cutoff,
                  transaction_count::text as transaction_count, entry_count::text as entry_count,
                  compressed_sha256, legacy_allowlist_sha256, legacy_batch_table_ids_sha256,
                  archived_transaction_ids_sha256, archived_entry_ids_sha256,
                  archive_proof_verified_at::text as archive_proof_verified_at,
                  status, committed_at::text as committed_at,
                  destructive_go_at::text as destructive_go_at,
                  destructive_go_batch_id::text as destructive_go_batch_id,
                  pruned_at::text as pruned_at, registry_cleaned_at::text as registry_cleaned_at,
                  pruned_transaction_count::text as pruned_transaction_count,
                  pruned_entry_count::text as pruned_entry_count,
                  pruned_transaction_ids_sha256, pruned_entry_ids_sha256,
                  registry_cleaned_key_count::text as registry_cleaned_key_count,
                  registry_cleaned_keys_sha256
                from public.chips_ledger_archive_batches
                where batch_id = 13
                  and object_path = 'v1/sha256/a7ff21fef10b1d22b963793d3cf6efd667319a7211ee47c7e6f755f293155e60.jsonl.gz';
              `);
              if (batches.length !== 1) fail("batch identity is missing or duplicated");
              const batch = batches[0];
              for (const [field, expected] of Object.entries({
                batch_id: EXPECTED.batchId,
                object_path: EXPECTED.objectPath,
                project_ref: EXPECTED.projectRef,
                source_policy_id: EXPECTED.sourcePolicyId,
                format_version: "2",
                cutoff: EXPECTED.cutoff,
                transaction_count: String(EXPECTED.transactionCount),
                entry_count: String(EXPECTED.entryCount),
                compressed_sha256: EXPECTED.archiveSha256,
                legacy_allowlist_sha256: EXPECTED.masterAllowlistSha256,
                legacy_batch_table_ids_sha256: EXPECTED.batchTableIdsSha256,
                archived_transaction_ids_sha256: EXPECTED.transactionIdsSha256,
                archived_entry_ids_sha256: EXPECTED.entryIdsSha256,
                status: "committed",
              })) {
                if (text(batch[field]) !== expected) fail(`${field} mismatch`);
              }
              const noGo = batch.destructive_go_at === null && batch.destructive_go_batch_id === null;
              const exactGo = batch.destructive_go_at !== null
                && text(batch.destructive_go_batch_id) === EXPECTED.batchId;
              if (!batch.committed_at || !batch.archive_proof_verified_at || (!noGo && !exactGo)) {
                fail("batch 13 GO is partial or not bound to the exact batch");
              }
              const unpruned = batch.pruned_at === null && batch.registry_cleaned_at === null;
              const pruned = batch.pruned_at !== null && batch.registry_cleaned_at !== null;
              if (!unpruned && !pruned) fail("batch has a partial prune receipt");
              if (pruned) {
                if (!exactGo) fail("complete pruned batch is missing exact batch 13 GO");
                for (const [field, expected] of Object.entries({
                  pruned_transaction_count: String(EXPECTED.transactionCount),
                  pruned_entry_count: String(EXPECTED.entryCount),
                  pruned_transaction_ids_sha256: EXPECTED.transactionIdsSha256,
                  pruned_entry_ids_sha256: EXPECTED.entryIdsSha256,
                  registry_cleaned_key_count: String(EXPECTED.registryCount),
                  registry_cleaned_keys_sha256: EXPECTED.registryKeysSha256,
                })) {
                  if (text(batch[field]) !== expected) fail(`receipt ${field} mismatch`);
                }
                const remaining = await tx.unsafe(`
                  select count(*)::text as registry_count
                  from public.chips_transaction_idempotency
                  where archive_batch_id = 13;
                `);
                if (text(remaining[0]?.registry_count) !== "0") fail("complete pruned batch still has registry rows");
              }

              const proofs = await tx.unsafe(`
                select
                  batch_id::text as batch_id, object_path, project_ref, source_policy_id,
                  cutoff::text as cutoff, source_run, query_sha256,
                  postgres_system_identifier, master_table_count::text as master_table_count,
                  master_table_ids_sha256, batch_number::text as batch_number,
                  batch_table_count::text as batch_table_count, batch_table_ids, batch_table_ids_sha256
                from public.chips_legacy_stage_allowlist_proofs
                where batch_id = 13
                  and object_path = 'v1/sha256/a7ff21fef10b1d22b963793d3cf6efd667319a7211ee47c7e6f755f293155e60.jsonl.gz';
              `);
              if (proofs.length !== 1) fail("immutable proof is missing or duplicated");
              const proof = proofs[0];
              for (const [field, expected] of Object.entries({
                batch_id: EXPECTED.batchId,
                object_path: EXPECTED.objectPath,
                project_ref: EXPECTED.projectRef,
                source_policy_id: EXPECTED.sourcePolicyId,
                cutoff: EXPECTED.cutoff,
                source_run: EXPECTED.sourceRun,
                query_sha256: EXPECTED.querySha256,
                postgres_system_identifier: EXPECTED.systemIdentifier,
                master_table_count: "974",
                master_table_ids_sha256: EXPECTED.masterAllowlistSha256,
                batch_number: "1",
                batch_table_count: "10",
                batch_table_ids_sha256: EXPECTED.batchTableIdsSha256,
              })) {
                if (text(proof[field]) !== expected) fail(`proof ${field} mismatch`);
              }
              const batchTableIds = proof.batch_table_ids;
              if (!Array.isArray(batchTableIds)
                || batchTableIds.length !== 10
                || hashLegacyStageAllowlistRegistryKeys(batchTableIds) !== EXPECTED.batchTableIdsSha256) {
                fail("proof batch table IDs are not the immutable ten-table set");
              }

              const registry = pruned ? [] : await tx.unsafe(`
                select
                  registry.idempotency_key,
                  registry.transaction_id::text as transaction_id,
                  registry.table_id::text as table_id,
                  registry.tx_type::text as tx_type,
                  registry.user_id::text as user_id,
                  registry.archive_batch_id::text as archive_batch_id
                from public.chips_transaction_idempotency registry
                where ${legacyStageAllowlistRegistryPredicate("$1")}
                order by idempotency_key;
              `, [batchTableIds]);
              if (!pruned) {
                assertLegacyStageAllowlistRegistryRows(registry, {
                  tableIds: batchTableIds,
                  expectedCount: EXPECTED.registryCount,
                  expectedKeysSha256: EXPECTED.registryKeysSha256,
                  fail: (code) => fail(`registry ${code}`),
                });
              }
            });
          } finally {
            await sql.end({ timeout: 5 });
          }
          process.stdout.write("execute-batch-13 read-only preflight passed\n");
          NODE

          recovery_dir="${RUNNER_TEMP}/chips-ledger-legacy-stage-allowlist-execute-${GITHUB_RUN_ID}"
          test ! -e "$recovery_dir"
          mkdir -p "$recovery_dir"
          node scripts/ops/chips-ledger-legacy-stage-allowlist-execute.mjs \
            --batch-id 13 \
            --object-path v1/sha256/a7ff21fef10b1d22b963793d3cf6efd667319a7211ee47c7e6f755f293155e60.jsonl.gz \
            --confirm-sha a7ff21fef10b1d22b963793d3cf6efd667319a7211ee47c7e6f755f293155e60 \
            --recovery-dir "$recovery_dir"
