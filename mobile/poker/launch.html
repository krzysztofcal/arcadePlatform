<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-jaxN1r9zVdXUYrbhTmSQISyaYaaBv0N/r0jFOS5X5xo='; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'">
<title>Arcade Poker</title>
<style id="pokerLaunchStyle">
html,body{margin:0;background:#0b1020;color:#eef3ff;}
#pokerLaunch{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:32px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 35%,#203258 0%,#10192f 38%,#0b1020 75%);font-family:Arial,Helvetica,sans-serif;text-align:center;}
#pokerLaunch[hidden]{display:none;}
#pokerLaunch svg{width:112px;height:112px;filter:drop-shadow(0 0 24px #61e2d333);}
#pokerLaunch h1{margin:0;font-size:clamp(28px,7vw,40px);letter-spacing:5px;font-weight:800;line-height:1.25;}
#pokerLaunch h1 span{display:block;color:#74ead5;font-size:.6em;letter-spacing:10px;margin-top:8px;padding-left:10px;}
#pokerLaunch .launch-loader{width:110px;height:3px;border-radius:4px;overflow:hidden;background:#ffffff1a;}
#pokerLaunch .launch-loader::after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#74ead5;animation:pokerLaunchPulse 1.2s ease-in-out infinite alternate;}
@keyframes pokerLaunchPulse{from{transform:translateX(0);opacity:.5;}to{transform:translateX(125%);opacity:1;}}
@media(prefers-reduced-motion:reduce){#pokerLaunch .launch-loader::after{animation:none;width:100%;}}
</style>
<script src="/mobile/poker/launch.js" integrity="sha256-jaxN1r9zVdXUYrbhTmSQISyaYaaBv0N/r0jFOS5X5xo=" defer></script>
